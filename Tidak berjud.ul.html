<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Laporan Tahfidz & Tugas Siswa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Container Utama -->
    <div class="max-w-4xl mx-auto p-4 md:p-8">
        
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-700">📚 Sistem Laporan Harian Siswa</h1>
            <p class="text-sm text-slate-500">Pantau perkembangan Ziyadah, Tilawah, Muraja'ah, dan Tugas Rumah</p>
        </header>

        <!-- Navigasi Switch View -->
        <div class="flex justify-center gap-3 mb-8">
            <button onclick="switchView('guru')" id="btn-guru" class="px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm bg-indigo-600 text-white">
                👨‍🏫 Input Data (Guru)
            </button>
            <button onclick="switchView('ortu')" id="btn-ortu" class="px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm bg-white text-slate-700 border border-slate-300 hover:bg-slate-100">
                👨‍👩‍👧 Laporan & Tugas (Orang Tua)
            </button>
        </div>

        <!-- ================= PANEL GURU ================= -->
        <div id="panel-guru" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b">📝 Form Laporan Harian & Tugas oleh Guru</h2>
            
            <form id="form-guru" onsubmit="simpanDataGuru(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nama Siswa</label>
                        <input type="text" id="g-nama" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Contoh: Ahmad Fulan">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Tanggal</label>
                        <input type="date" id="g-tgl" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Ziyadah (Hafalan Baru)</label>
                        <input type="text" id="g-ziyadah" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Contoh: QS Al-Baqarah: 1-5">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Tilawah / BBQ</label>
                        <input type="text" id="g-tilawah" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Contoh: Jilid 3 halaman 15">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Tikrar</label>
                        <input type="text" id="g-tikrar" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Contoh: Halaman 20-22">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Muraja'ah</label>
                        <input type="text" id="g-murajaah" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Contoh: Juz 30 (An-Nazi'at)">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Nilai Sikap</label>
                        <select id="g-sikap" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            <option value="Sangat Baik">Sangat Baik</option>
                            <option value="Baik">Baik</option>
                            <option value="Cukup">Cukup</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Catatan Guru</label>
                        <input type="text" id="g-catatan" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Pesan untuk anak/ortu...">
                    </div>
                </div>

                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 space-y-4 mt-4">
                    <h3 class="text-sm font-bold text-indigo-800">📌 Tugas untuk di Rumah</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-indigo-700 mb-1">Ziyadah Besok</label>
                            <input type="text" id="g-t-ziyadah" class="w-full px-3 py-2 border rounded-lg text-sm bg-white" placeholder="Target besok">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-indigo-700 mb-1">Muraja'ah di Rumah</label>
                            <input type="text" id="g-t-murajaah" class="w-full px-3 py-2 border rounded-lg text-sm bg-white" placeholder="Target muraja'ah">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-indigo-700 mb-1">Tikrar di Rumah</label>
                            <input type="text" id="g-t-tikrar" class="w-full px-3 py-2 border rounded-lg text-sm bg-white" placeholder="Target tikrar">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow">
                    💾 Simpan & Terbitkan Laporan
                </button>
            </form>
        </div>

        <!-- ================= PANEL ORANG TUA ================= -->
        <div id="panel-ortu" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 hidden">
            <h2 class="text-lg font-semibold text-slate-800 mb-4 pb-2 border-b">👁️ Hasil Laporan Guru & Validasi Orang Tua</h2>
            
            <div id="container-laporan" class="space-y-6">
                <!-- Data Laporan akan dimuat secara dinamis disini -->
                <div class="text-center py-10 text-slate-400 text-sm">
                    Belum ada data laporan dari guru. Silakan buat laporan terlebih dahulu melalui panel guru.
                </div>
            </div>
        </div>

    </div>

    <!-- Skrip JavaScript -->
    <script>
        // Data sementara disimpan di localStorage atau variabel global
        let dataLaporan = JSON.parse(localStorage.getItem('dataLaporanSiswa')) || [];

        // Set default tanggal hari ini pada input guru
        document.getElementById('g-tgl').valueAsDate = new Date();

        function switchView(role) {
            const btnGuru = document.getElementById('btn-guru');
            const btnOrtu = document.getElementById('btn-ortu');
            const panelGuru = document.getElementById('panel-guru');
            const panelOrtu = document.getElementById('panel-ortu');

            if (role === 'guru') {
                btnGuru.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm bg-indigo-600 text-white";
                btnOrtu.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm bg-white text-slate-700 border border-slate-300 hover:bg-slate-100";
                panelGuru.classList.remove('hidden');
                panelOrtu.classList.add('hidden');
            } else {
                btnOrtu.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm bg-indigo-600 text-white";
                btnGuru.className = "px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-sm bg-white text-slate-700 border border-slate-300 hover:bg-slate-100";
                panelOrtu.classList.remove('hidden');
                panelGuru.classList.add('hidden');
                renderLaporanOrtu();
            }
        }

        function simpanDataGuru(e) {
            e.preventDefault();
            
            const newData = {
                id: Date.now(),
                nama: document.getElementById('g-nama').value,
                tgl: document.getElementById('g-tgl').value,
                ziyadah: document.getElementById('g-ziyadah').value || '-',
                tilawah: document.getElementById('g-tilawah').value || '-',
                tikrar: document.getElementById('g-tikrar').value || '-',
                murajaah: document.getElementById('g-murajaah').value || '-',
                sikap: document.getElementById('g-sikap').value,
                catatan: document.getElementById('g-catatan').value || '-',
                tugas: {
                    ziyadah: document.getElementById('g-t-ziyadah').value || '-',
                    murajaah: document.getElementById('g-t-murajaah').value || '-',
                    tikrar: document.getElementById('g-t-tikrar').value || '-'
                },
                // Status dari Orang Tua
                ortuStatus: {
                    ziyadahDone: false,
                    murajaahDone: false,
                    tikrarDone: false,
                    bacaLuar: false,
                    komentar: ''
                }
            };

            dataLaporan.unshift(newData);
            localStorage.setItem('dataLaporanSiswa', JSON.stringify(dataLaporan));
            
            alert('Laporan berhasil disimpan!');
            document.getElementById('form-guru').reset();
            document.getElementById('g-tgl').valueAsDate = new Date();
            switchView('ortu');
        }

        function renderLaporanOrtu() {
            const container = document.getElementById('container-laporan');
            
            if (dataLaporan.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400 text-sm">
                        Belum ada data laporan dari guru. Silakan buat laporan terlebih dahulu melalui panel guru.
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            dataLaporan.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "border border-slate-200 rounded-xl p-5 bg-slate-50/50 shadow-sm space-y-4";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start border-b pb-3">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base">${item.nama}</h3>
                            <span class="text-xs text-slate-500">📅 Tanggal Laporan: ${item.tgl}</span>
                        </div>
                        <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full">Sikap: ${item.sikap}</span>
                    </div>

                    <!-- Hasil Laporan Guru -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs bg-white p-3 rounded-lg border">
                        <div><strong class="text-slate-400 block">Ziyadah:</strong> ${item.ziyadah}</div>
                        <div><strong class="text-slate-400 block">Tilawah/BBQ:</strong> ${item.tilawah}</div>
                        <div><strong class="text-slate-400 block">Tikrar:</strong> ${item.tikrar}</div>
                        <div><strong class="text-slate-400 block">Muraja'ah:</strong> ${item.murajaah}</div>
                    </div>
                    
                    <div class="text-xs bg-amber-50 text-amber-900 p-2.5 rounded-lg border border-amber-200">
                        <strong>Catatan Guru:</strong> ${item.catatan}
                    </div>

                    <!-- Bagian Tugas Rumah & Checkbox Orang Tua -->
                    <div class="bg-indigo-50/60 p-4 rounded-xl border border-indigo-100 space-y-3">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-900">🏠 Validasi Tugas & Latihan di Rumah</h4>
                        
                        <div class="space-y-2 text-sm">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" ${item.ortuStatus.ziyadahDone ? 'checked' : ''} onchange="updateStatus(${item.id}, 'ziyadahDone', this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                                <span>Ziyadah Besok (<em class="text-indigo-700 font-medium">${item.tugas.ziyadah}</em>) sudah dilakukan?</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" ${item.ortuStatus.murajaahDone ? 'checked' : ''} onchange="updateStatus(${item.id}, 'murajaahDone', this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                                <span>Muraja'ah di rumah (<em class="text-indigo-700 font-medium">${item.tugas.murajaah}</em>) sudah dilakukan?</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" ${item.ortuStatus.tikrarDone ? 'checked' : ''} onchange="updateStatus(${item.id}, 'tikrarDone', this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                                <span>Tikrar di rumah (<em class="text-indigo-700 font-medium">${item.tugas.tikrar}</em>) sudah dilakukan?</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer pt-1 border-t border-indigo-200">
                                <input type="checkbox" ${item.ortuStatus.bacaLuar ? 'checked' : ''} onchange="updateStatus(${item.id}, 'bacaLuar', this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                                <span class="font-medium text-indigo-900">Tambahan latihan membaca di rumah hari ini</span>
                            </label>
                        </div>

                        <!-- Kolom Komentar Orang Tua -->
                        <div class="pt-2">
                            <label class="block text-xs font-semibold text-indigo-900 mb-1">Komentar / Pesan Orang Tua untuk Guru:</label>
                            <div class="flex gap-2">
                                <input type="text" id="komentar-${item.id}" value="${item.ortuStatus.komentar}" placeholder="Tulis komentar atau kendala di rumah..." class="flex-1 px-3 py-1.5 border rounded-lg text-sm bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <button onclick="simpanKomentar(${item.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-1.5 rounded-lg font-medium transition">Kirim</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateStatus(id, key, value) {
            const index = dataLaporan.findIndex(item => item.id === id);
            if (index !== -1) {
                dataLaporan[index].ortuStatus[key] = value;
                localStorage.setItem('dataLaporanSiswa', JSON.stringify(dataLaporan));
            }
        }

        function simpanKomentar(id) {
            const inputVal = document.getElementById(`komentar-${id}`).value;
            const index = dataLaporan.findIndex(item => item.id === id);
            if (index !== -1) {
                dataLaporan[index].ortuStatus.komentar = inputVal;
                localStorage.setItem('dataLaporanSiswa', JSON.stringify(dataLaporan));
                alert('Komentar berhasil disimpan!');
            }
        }
    </script>
</body>
</html>
